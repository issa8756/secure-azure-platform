name: CI
permissions:
  contents: read
  id-token: write
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Check Terraform formatting
        working-directory: infra
        run: terraform fmt -check

      - name: Initialize Terraform
        working-directory: infra
        run: terraform init

      - name: Validate Terraform
        working-directory: infra
        run: terraform validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t secure-azure-platform:ci .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-azure-platform:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Log in to Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name acrsecureplatformdev

      - name: Tag and push image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag secure-azure-platform:ci \
            acrsecureplatformdev.azurecr.io/secure-azure-platform:${{ github.sha }}

          docker push \
            acrsecureplatformdev.azurecr.io/secure-azure-platform:${{ github.sha }}
